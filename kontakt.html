<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8081 https://finance-tracker-backend-5rru.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Kontakt – Finance OS</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e131b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fragen, Ideen oder Probleme mit Finance OS? Schreib mir über das Kontaktformular." />
    <link rel="canonical" href="https://finance-os.dev/kontakt.html" />
    <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finance OS" />
    <script src="js/shared/translations.js?v=2026100852"></script>
    <script src="js/shared/i18n.js?v=2026100852"></script>
    <script src="js/shared/update.js?v=2026100852" defer></script>
    <script src="js/shared/site.js?v=2026100852"></script>
    <link rel="stylesheet" href="css/shared/base.css?v=2026100852" />
    <link rel="stylesheet" href="css/pages/login.css?v=2026100852" />
    <link rel="stylesheet" href="css/pages/contact.css?v=2026100852" />
  </head>
  <body>
    <main class="legal-page contact-page">
      <div class="legal-top">
        <a class="back" href="./" data-back>← Zurück</a>
        <div class="page-tools">
          <select class="lang-select" data-lang-select aria-label="Sprache">
            <option value="de">DE</option>
            <option value="en">EN</option>
            <option value="fr">FR</option>
            <option value="it">IT</option>
          </select>
          <button type="button" class="icon-button" data-theme-toggle><svg class="bulb" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="bulb-rays" d="M12 1.5v2M4.2 4.2l1.4 1.4M1.5 12h2M20.5 12h2M18.4 5.6l1.4-1.4"/><path class="bulb-glass" d="M8.5 15.5c-1.6-1.2-2.5-3-2.5-5a6 6 0 0 1 12 0c0 2-.9 3.8-2.5 5v2h-7z"/><path d="M9.5 20.5h5M10 17.5h4"/></svg></button>
        </div>
      </div>
      <h1>Kontakt</h1>
      <p class="note">Fragen, Ideen oder ein Problem mit Finance OS? Schreib mir – ich antworte per E-Mail.</p>

      <section class="card">
        <p id="contactNotice" class="auth-notice" role="status" hidden></p>

        <form id="contactForm" class="contact-form" novalidate>
          <div class="field">
            <div class="label-row">
              <label for="contactName">Vor- und Nachname</label>
              <span class="char-count" data-count-for="contactName" aria-hidden="true"></span>
            </div>
            <input id="contactName" name="name" autocomplete="name" maxlength="30" required />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="contactEmail">E-Mail</label>
              <span class="char-count" data-count-for="contactEmail" aria-hidden="true"></span>
            </div>
            <input id="contactEmail" name="email" type="email" autocomplete="email" maxlength="30" required />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="contactSubject">Betreff</label>
              <span class="char-count" data-count-for="contactSubject" aria-hidden="true"></span>
            </div>
            <input id="contactSubject" name="subject" maxlength="30" required />
          </div>

          <div class="field">
            <div class="label-row">
              <label for="contactMessage">Nachricht</label>
              <span class="char-count" data-count-for="contactMessage" aria-hidden="true"></span>
            </div>
            <textarea id="contactMessage" name="message" rows="7" maxlength="2000" required></textarea>
          </div>

          <!-- Hidden from people; spam bots fill it in and are ignored by the backend -->
          <div class="contact-trap" aria-hidden="true">
            <label for="contactWebsite">Website</label>
            <input id="contactWebsite" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <p id="contactError" class="auth-error" role="alert" hidden></p>

          <button type="submit" class="primary contact-submit" id="contactSubmit">Nachricht senden</button>

          <p class="note contact-legal">
            Deine Angaben werden nur verwendet, um dir zu antworten. Mehr dazu in der
            <a href="datenschutz.html">Datenschutzerklärung</a>.
          </p>
        </form>
      </section>
      <p class="auth-links legal-links">
        <a href="impressum.html">Impressum</a>
        <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="kontakt.html">Kontakt</a>
      </p>
    </main>
    <script src="js/shared/api.js?v=2026100852"></script>
    <script src="js/shared/back.js?v=2026100852"></script>
    <script src="js/pages/contact.js?v=2026100852"></script>
  </body>
</html>
